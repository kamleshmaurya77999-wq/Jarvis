<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e27">
<title>JARVIS Hindi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at center, #0f1635 0%, #05070f 100%);
    color: #e0f7ff; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none;
  }
  header { text-align: center; padding: 18px 16px 8px; position: relative; z-index: 2; }
  header h1 { font-size: 1.5rem; letter-spacing: 8px; font-weight: 300; color: #4dd0ff; text-shadow: 0 0 12px rgba(77, 208, 255, 0.6); }
  header p { font-size: 0.7rem; letter-spacing: 3px; color: #4a6a8a; margin-top: 4px; text-transform: uppercase; }
  .status {
    margin: 8px auto 0; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: #4dd0ff;
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border: 1px solid rgba(77, 208, 255, 0.3);
    border-radius: 20px; background: rgba(77, 208, 255, 0.06);
  }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #4dd0ff; box-shadow: 0 0 8px #4dd0ff; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.8); } }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 2; padding: 10px; min-height: 0; }
  .orb-wrap { position: relative; width: min(62vw, 260px); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; margin: 8px 0; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(77, 208, 255, 0.25); animation: spin 14s linear infinite; }
  .ring.r2 { inset: 8%; border-color: rgba(0, 255, 200, 0.18); border-style: dashed; animation-duration: 20s; animation-direction: reverse; }
  .ring.r3 { inset: 16%; border-color: rgba(77, 208, 255, 0.12); animation-duration: 9s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .orb {
    position: relative; width: 58%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8fe8ff, #1e9cd8 45%, #0b3a66 100%);
    box-shadow: 0 0 30px rgba(77, 208, 255, 0.5), 0 0 80px rgba(30, 156, 216, 0.35), inset 0 0 25px rgba(255, 255, 255, 0.25);
    cursor: pointer; transition: transform 0.15s ease, box-shadow 0.3s ease; display: flex; align-items: center; justify-content: center;
  }
  .orb:active { transform: scale(0.94); }
  .orb.listening { animation: listenPulse 1.2s ease-in-out infinite; box-shadow: 0 0 40px rgba(0, 255, 200, 0.7), 0 0 100px rgba(0, 255, 200, 0.4), inset 0 0 30px rgba(255, 255, 255, 0.35); }
  @keyframes listenPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .orb.speaking { animation: speakPulse 0.5s ease-in-out infinite alternate; box-shadow: 0 0 45px rgba(120, 180, 255, 0.8), 0 0 120px rgba(120, 180, 255, 0.5), inset 0 0 30px rgba(255, 255, 255, 0.4); }
  @keyframes speakPulse { from { transform: scale(1); filter: brightness(1); } to { transform: scale(1.04); filter: brightness(1.25); } }
  .orb-icon { font-size: 2rem; filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)); pointer-events: none; }
  .hint { font-size: 0.78rem; letter-spacing: 1.5px; color: #5b7a9c; text-align: center; margin-top: 12px; min-height: 1.2em; }
  .log { flex: 1; width: 100%; max-width: 560px; overflow-y: auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; min-height: 0; scrollbar-width: none; }
  .log::-webkit-scrollbar { display: none; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 0.88rem; line-height: 1.4; word-wrap: break-word; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; background: rgba(30, 156, 216, 0.18); border: 1px solid rgba(77, 208, 255, 0.25); color: #bfe9ff; border-bottom-right-radius: 4px; }
  .msg.jarvis { align-self: flex-start; background: rgba(0, 255, 200, 0.08); border: 1px solid rgba(0, 255, 200, 0.2); color: #b8fff0; border-bottom-left-radius: 4px; }
  .msg.jarvis::before { content: 'JARVIS'; display: block; font-size: 0.6rem; letter-spacing: 2px; color: #00d4aa; margin-bottom: 3px; opacity: 0.8; }
  footer { position: relative; z-index: 2; display: flex; justify-content: center; gap: 14px; padding: 10px 16px max(16px, env(safe-area-inset-bottom)); }
  .ctrl { display: flex; flex-direction: column; align-items: center; gap: 5px; background: rgba(77, 208, 255, 0.06); border: 1px solid rgba(77, 208, 255, 0.22); border-radius: 14px; padding: 10px 18px; color: #9fd8f5; font-size: 0.68rem; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s ease; min-width: 86px; }
  .ctrl:active { transform: scale(0.95); background: rgba(77, 208, 255, 0.14); }
  .ctrl.off { opacity: 0.4; }
  .ctrl svg { width: 22px; height: 22px; fill: currentColor; }
  .warn { display: none; position: fixed; inset: 0; background: rgba(5, 7, 15, 0.95); z-index: 99; align-items: center; justify-content: center; text-align: center; padding: 30px; font-size: 0.95rem; line-height: 1.6; color: #ff8b8b; }
  .warn.show { display: flex; }
  @media (max-height: 640px) { header h1 { font-size: 1.2rem; letter-spacing: 6px; } .orb-wrap { width: min(50vw, 200px); } }
</style>
</head>
<body>

<header>
  <h1>JARVIS</h1>
  <p>Voice Interface</p>
  <div class="status"><span class="dot"></span><span id="statusText">Shuru karne ke liye tap karein</span></div>
</header>

<main>
  <div class="orb-wrap">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="orb" id="orb" role="button" aria-label="Activate JARVIS">
      <span class="orb-icon">🎙️</span>
    </div>
  </div>
  <div class="hint" id="hint">Core par tap karein aur bolein</div>
</main>

<div class="log" id="log"></div>

<footer>
  <button class="ctrl" id="muteBtn" aria-label="Toggle mute">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <span id="muteLabel">Aawaz On</span>
  </button>
  <button class="ctrl" id="clearBtn" aria-label="Clear log">
    <svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
    <span>Clear</span>
  </button>
</footer>

<div class="warn" id="warn">
  ⚠️ Aapka browser voice support nahi karta.<br><br>
  Kripya Chrome ya Safari ka use karein.
</div>

<script>
(function () {
  'use strict';

  const orb        = document.getElementById('orb');
  const hint       = document.getElementById('hint');
  const statusText = document.getElementById('statusText');
  const logEl      = document.getElementById('log');
  const muteBtn    = document.getElementById('muteBtn');
  const muteLabel  = document.getElementById('muteLabel');
  const clearBtn   = document.getElementById('clearBtn');
  const warn       = document.getElementById('warn');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    warn.classList.add('show');
    return;
  }

  let recognition   = null;
  let isListening   = false;
  let muted         = false;
  let speaking      = false;

  function createRecognition() {
    const r = new SpeechRecognition();
    r.lang = 'hi-IN';
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 1;

    r.onstart = () => {
      isListening = true;
      orb.classList.add('listening');
      statusText.textContent = 'Sun raha hoon…';
      hint.textContent = 'Main sun raha hoon…';
    };

    r.onresult = (event) => {
      let interim = '';
      let finalText = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += transcript;
        else interim += transcript;
      }
      if (interim) hint.textContent = interim;
      if (finalText) handleUserSpeech(finalText.trim());
    };

    r.onerror = (e) => {
      if (e.error === 'not-allowed') {
        statusText.textContent = 'Mic band hai';
        hint.textContent = 'Kripya mic ki permission dein.';
      } else if (e.error === 'no-speech') {
        hint.textContent = 'Kuch sunai nahi diya. Phir se tap karein.';
      }
      stopListening();
    };

    r.onend = () => {
      stopListening();
      if (!speaking) {
        statusText.textContent = 'Shuru karne ke liye tap karein';
        hint.textContent = 'Core par tap karein aur bolein';
      }
    };

    return r;
  }

  function startListening() {
    if (isListening || speaking) return;
    recognition = createRecognition();
    try {
      recognition.start();
    } catch (e) {
      hint.textContent = 'Mic start nahi ho paya.';
    }
  }

  function stopListening() {
    isListening = false;
    orb.classList.remove('listening');
    if (recognition) {
      try { recognition.abort(); } catch (e) {}
      recognition = null;
    }
  }

  function toggleListen() {
    if (isListening) {
      stopListening();
      statusText.textContent = 'Shuru karne ke liye tap karein';
      hint.textContent = 'Core par tap karein aur bolein';
    } else {
      startListening();
    }
  }

  function speak(text) {
    if (muted) return;
    if (!('speechSynthesis' in window)) return;

    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();
    
    let voice = voices.find(v => v.lang.includes('hi') || v.name.includes('Hindi'));
    if (!voice) voice = voices.find(v => v.lang.includes('IN'));
    if (voice) utter.voice = voice;

    utter.rate   = 1.0;
    utter.pitch  = 0.9;
    utter.volume = 1;

    utter.onstart = () => {
      speaking = true;
      orb.classList.add('speaking');
      statusText.textContent = 'Bol raha hoon…';
      hint.textContent = '';
    };

    utter.onend = () => {
      speaking = false;
      orb.classList.remove('speaking');
      statusText.textContent = 'Shuru karne ke liye tap karein';
      hint.textContent = 'Core par tap karein aur bolein';
    };

    window.speechSynthesis.speak(utter);
  }

  function addMessage(text, who) {
    const el = document.createElement('div');
    el.className = 'msg ' + who;
    el.textContent = text;
    logEl.appendChild(el);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function handleUserSpeech(text) {
    addMessage(text, 'user');
    statusText.textContent = 'Soch raha hoon…';
    hint.textContent = '';
    stopListening();

    setTimeout(() => {
      const reply = getReply(text);
      addMessage(reply, 'jarvis');
      speak(reply);
    }, 250);
  }

  // --- JARVIS KA NAYA DIMAAG (BRAIN) ---
  function getReply(input) {
    const t = input.toLowerCase();

    // 1. Tumhe kisne banaya?
    if (t.includes('kisne banaya') || t.includes('kaun banaya') || t.includes('maker') || t.includes('किसने बनाया')) {
      return 'Mujhe Kamlesh Maurya ne banaya hai. Main unka personal AI assistant hoon.';
    }

    // 2. Time / Samay
    if (t.includes('time') || t.includes('samay') || t.includes('baje') || t.includes('समय') || t.includes('बजे')) {
      const time = new Date().toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
      return 'Abhi samay hai ' + time + '.';
    }

    // 3. Date / Tarikh
    if (t.includes('date') || t.includes('tarikh') || t.includes('तारीख') || t.includes('din') || t.includes('दिन')) {
      const date = new Date().toLocaleDateString('hi-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      return 'Aaj ' + date + ' hai.';
    }

    // 4. Greetings
    if (t.includes('hello') || t.includes('hi ') || t.includes('hey') || t.includes('namaste') || t.includes('namaskar') || t.includes('नमस्ते')) {
      return 'Namaste! Main JARVIS hoon. Aapki kya sahayata kar sakta hoon?';
    }

    // 5. How are you
    if (t.includes('kaise ho') || t.includes('kya haal') || t.includes('कैसे हो') || t.includes('क्या हाल')) {
      return 'Main bilkul theek hoon. Aap kaise hain?';
    }

    // 6. Joke
    if (t.includes('joke') || t.includes('hasi') || t.includes('chutkula') || t.includes('जोक') || t.includes('चुटकुला') || t.includes('हंसी')) {
      const jokes = [
        'Teacher: Tumne homework kyun nahi kiya? Student: Sir, maine socha aap check nahi karoge.',
        'Ek aadmi doctor ke paas gaya bola: Doctor sahab, mujhe bhoolne ki bimari hai. Doctor: Kab se? Aadmi: Kya kab se?',
        'Programmer ki shaadi kyun nahi hoti? Kyunki wo hamesha "Try-Catch" me rehta hai.'
      ];
      return jokes[Math.floor(Math.random() * jokes.length)];
    }

    // 7. YouTube kholna (Direct website)
    if (t.includes('youtube kholo') || t.includes('open youtube') || t.includes('यूट्यूब खोलो')) {
      window.open('https://www.youtube.com', '_blank');
      return 'YouTube khol raha hoon.';
    }

    // 8. YouTube par kuch play/search karna
    if (t.includes('youtube par') || t.includes('youtube pe') || t.includes('यूट्यूब पर')) {
      const query = input.replace(/youtube par|youtube pe|play karo|चलाओ|यूट्यूब पर/gi, '').trim();
      if (query.length > 1) {
        window.open('https://www.youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
        return 'YouTube par ' + query + ' search kar raha hoon.';
      }
    }

    // 9. Instagram kholna
    if (t.includes('instagram kholo') || t.includes('open instagram') || t.includes('इंस्टाग्राम')) {
      window.open('https://www.instagram.com', '_blank');
      return 'Instagram khol raha hoon.';
    }

    // 10. Google kholna
    if (t.includes('google kholo') || t.includes('open google') || t.includes('गूगल खोलो')) {
      window.open('https://www.google.com', '_blank');
      return 'Google khol raha hoon.';
    }

    // 11. Google Search (General)
    if (t.includes('search karo') || t.includes('dhundo') || t.includes('सर्च') || t.includes('ढूंढो') || t.includes('खोजो')) {
      const query = input.replace(/search karo|dhundo|google par|सर्च करो|ढूंढो|गूगल पर|खोजो/gi, '').trim();
      if (query.length > 1) {
        window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
        return query + ' ko Google par search kar raha hoon.';
      } else {
        return 'Aap kya search karna chahte hain?';
      }
    }

    // 12. Thanks
    if (t.includes('thank') || t.includes('shukriya') || t.includes('dhanyawad') || t.includes('धन्यवाद') || t.includes('शुक्रिया')) {
      return 'Aapka swagat hai.';
    }

    // 13. Bye
    if (t.includes('bye') || t.includes('alvida') || t.includes('band karo') || t.includes('अलविदा') || t.includes('बंद करो')) {
      return 'Alvida! JARVIS sign off kar raha hai.';
    }

    // Default
    return 'Main abhi ye samajh nahi paya. Aap mujhse samay, tarikh, joke, YouTube ya Google search ke liye keh sakte hain.';
  }

  // Events
  orb.addEventListener('click', toggleListen);

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.classList.toggle('off', muted);
    muteLabel.textContent = muted ? 'Aawaz Off' : 'Aawaz On';
    if (muted) {
      window.speechSynthesis.cancel();
      speaking = false;
      orb.classList.remove('speaking');
    }
  });

  clearBtn.addEventListener('click', () => {
    logEl.innerHTML = '';
  });

  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopListening();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }
  });
})();
</script>
</body>
</html>
